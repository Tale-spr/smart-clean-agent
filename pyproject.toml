[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-clean-agent"
version = "0.1.0"
description = "Smart cleaning robot agent service with Streamlit, FastAPI, RAG, memory, and evaluation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
